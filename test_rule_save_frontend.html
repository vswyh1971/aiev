<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试规则保存</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>测试规则保存功能</h1>
        <div id="message" class="mt-3"></div>
        <button id="testSave" class="btn btn-primary mt-3">测试保存规则</button>
    </div>

    <script>
        let token = '';

        async function apiRequest(method, url, data = null, isFormData = false) {
            const options = {
                method,
                headers: {},
                credentials: 'include'
            };
            
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            
            if (data) {
                if (isFormData) {
                    options.body = data;
                } else {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(data);
                }
            }
            
            try {
                console.log('发送API请求:', method, `http://localhost:8000${url}`);
                const response = await fetch(`http://localhost:8000${url}`, options);
                console.log('API响应状态:', response.status);
                
                if (response.status === 401) {
                    throw new Error('登录已过期，请重新登录');
                }
                
                if (!response.ok) {
                    let errorMessage = `请求失败 (${response.status})`;
                    try {
                        const error = await response.json();
                        if (error.detail) {
                            errorMessage = error.detail;
                        } else if (error.error) {
                            errorMessage = error.error;
                        }
                    } catch (e) {
                        // 解析错误信息失败，使用默认错误信息
                    }
                    throw new Error(errorMessage);
                }
                
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    return await response.json();
                } else {
                    return await response.text();
                }
            } catch (error) {
                console.error('API请求错误:', error);
                throw error;
            }
        }

        async function login() {
            try {
                const formData = new FormData();
                formData.append('username', 'admin');
                formData.append('password', 'admin123');
                const result = await apiRequest('POST', '/api/auth/login', formData, true);
                token = result.access_token;
                console.log('登录成功，token:', token);
                return true;
            } catch (error) {
                console.error('登录失败:', error);
                return false;
            }
        }

        async function testSaveRule() {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = '<div class="alert alert-info">正在测试规则保存...</div>';

            try {
                // 先登录
                const loginSuccess = await login();
                if (!loginSuccess) {
                    messageDiv.innerHTML = '<div class="alert alert-danger">登录失败</div>';
                    return;
                }

                // 测试保存规则
                const payload = {
                    name: '测试规则',
                    dataset_id: 1,
                    rule_type: 'content_safety',
                    input_fields: ['question'],
                    expected_field: 'answer',
                    evaluation_criteria: '测试评估标准',
                    risk_levels: { high: '高风险', medium: '中风险', low: '低风险' }
                };

                const result = await apiRequest('POST', '/api/rules', payload);
                console.log('保存规则成功:', result);
                messageDiv.innerHTML = '<div class="alert alert-success">规则保存成功！</div>';

                // 测试加载规则
                const rules = await apiRequest('GET', '/api/rules');
                console.log('加载规则成功:', rules);
                messageDiv.innerHTML += '<div class="alert alert-success">规则加载成功！</div>';

            } catch (error) {
                console.error('保存规则失败:', error);
                messageDiv.innerHTML = `<div class="alert alert-danger">保存失败: ${error.message}</div>`;
            }
        }

        document.getElementById('testSave').addEventListener('click', testSaveRule);
    </script>
</body>
</html>
