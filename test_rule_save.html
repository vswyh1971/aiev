<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试规则保存</title>
    <script>
        let token = '';
        
        // 模拟前端的apiRequest函数
        async function apiRequest(method, url, data = null, isFormData = false) {
            const options = {
                method,
                headers: {},
                credentials: 'include'
            };
            
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            
            if (data) {
                if (isFormData) {
                    options.body = data;
                    delete options.headers['Content-Type'];
                } else {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(data);
                }
            }
            
            try {
                console.log('发送API请求:', method, `http://localhost:8000${url}`);
                console.log('请求数据:', data);
                const response = await fetch(`http://localhost:8000${url}`, options);
                console.log('API响应状态:', response.status);
                
                if (response.status === 401) {
                    if (url === '/api/auth/login') {
                        // 登录失败
                    } else {
                        throw new Error('登录已过期，请重新登录');
                    }
                }
                
                if (!response.ok) {
                    let errorMessage = `请求失败 (${response.status})`;
                    try {
                        const error = await response.json();
                        console.log('API错误响应:', error);
                        if (error.detail) {
                            errorMessage = error.detail;
                        } else if (error.error) {
                            errorMessage = error.error;
                        }
                    } catch (e) {
                        try {
                            const text = await response.text();
                            if (text) {
                                errorMessage = text;
                            }
                        } catch (e2) {
                        }
                    }
                    throw new Error(errorMessage);
                }
                
                const result = await response.json();
                console.log('API响应数据:', result);
                return result;
            } catch (error) {
                console.error('API Error:', error);
                if (typeof error === 'object' && error !== null) {
                    if (error.message) {
                        throw new Error(error.message);
                    } else {
                        throw new Error('网络请求失败，请检查网络连接');
                    }
                } else {
                    throw new Error(String(error));
                }
            }
        }
        
        // 登录函数
        async function login() {
            try {
                const response = await apiRequest('POST', '/api/auth/login', {
                    username: 'admin',
                    password: 'admin123'
                }, true);
                token = response.access_token;
                document.getElementById('login-status').textContent = '登录成功';
                document.getElementById('token').textContent = token.substring(0, 50) + '...';
            } catch (error) {
                document.getElementById('login-status').textContent = '登录失败: ' + error.message;
            }
        }
        
        // 测试保存规则
        async function saveRule() {
            try {
                if (!token) {
                    alert('请先登录');
                    return;
                }
                
                const payload = {
                    name: '测试规则',
                    dataset_id: 7,
                    rule_type: 'safety',
                    input_fields: ['question'],
                    expected_field: 'expected_response',
                    evaluation_criteria: '测试评估标准',
                    risk_levels: { high: '高风险', medium: '中风险', low: '低风险' }
                };
                
                const response = await apiRequest('POST', '/api/rules', payload);
                document.getElementById('save-status').textContent = '保存成功: ' + JSON.stringify(response);
            } catch (error) {
                document.getElementById('save-status').textContent = '保存失败: ' + error.message;
                console.error('保存失败:', error);
            }
        }
        
        // 加载规则列表
        async function loadRules() {
            try {
                if (!token) {
                    alert('请先登录');
                    return;
                }
                
                const rules = await apiRequest('GET', '/api/rules');
                document.getElementById('rules-status').textContent = '加载成功，规则数量: ' + rules.length;
                document.getElementById('rules-list').textContent = JSON.stringify(rules, null, 2);
            } catch (error) {
                document.getElementById('rules-status').textContent = '加载失败: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <h1>测试规则保存功能</h1>
    
    <button onclick="login()">登录</button>
    <div id="login-status">未登录</div>
    <div id="token"></div>
    
    <br><br>
    
    <button onclick="saveRule()">保存规则</button>
    <div id="save-status">未保存</div>
    
    <br><br>
    
    <button onclick="loadRules()">加载规则列表</button>
    <div id="rules-status">未加载</div>
    <pre id="rules-list"></pre>
    
    <br><br>
    <div>
        <h3>控制台日志</h3>
        <p>请打开浏览器开发者工具查看详细日志</p>
    </div>
</body>
</html>
