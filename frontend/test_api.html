<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试评估结果 API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        pre { white-space: pre-wrap; word-wrap: break-word; max-height: 200px; overflow-y: auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>评估结果 API 测试</h1>
    <button onclick="testAPI()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">测试 API</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>正在测试...</p>';
            
            try {
                // 先登录
                const loginResponse = await fetch('http://localhost:8001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'username': 'admin',
                        'password': 'admin123'
                    })
                });
                
                if (!loginResponse.ok) {
                    throw new Error(`登录失败：${loginResponse.status}`);
                }
                
                const loginData = await loginResponse.json();
                const token = loginData.access_token;
                console.log('登录成功，token:', token);
                
                // 获取评估结果
                const response = await fetch('http://localhost:8001/api/tasks/1/results?page=1&page_size=100', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`API 请求失败：${response.status}`);
                }
                
                const data = await response.json();
                console.log('API 返回数据:', data);
                
                let html = `
                    <div class="result">
                        <h3>API 返回数据</h3>
                        <p><strong>总数:</strong> ${data.total}</p>
                        <p><strong>当前页:</strong> ${data.page}</p>
                        <p><strong>每页大小:</strong> ${data.page_size}</p>
                        <p><strong>数据条数:</strong> ${data.data ? data.data.length : 0}</p>
                `;
                
                if (data.data && data.data.length > 0) {
                    html += `
                        <h4>数据表格:</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>评估结果</th>
                                    <th>输入数据</th>
                                    <th>模型输出</th>
                                    <th>评估过程</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.data.forEach((item, index) => {
                        html += `
                            <tr>
                                <td>${item.case_index + 1}</td>
                                <td><span class="${item.evaluation_result === 'passed' ? 'success' : 'error'}">${item.evaluation_result}</span></td>
                                <td><pre>${JSON.stringify(item.input_data, null, 2)}</pre></td>
                                <td><pre>${item.model_output}</pre></td>
                                <td><pre>${item.details_text || '无'}</pre></td>
                            </tr>
                        `;
                    });
                    
                    html += `
                            </tbody>
                        </table>
                    `;
                } else {
                    html += '<p class="error">没有数据</p>';
                }
                
                html += '</div>';
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">错误：${error.message}</div>`;
                console.error('错误详情:', error);
            }
        }
    </script>
</body>
</html>
