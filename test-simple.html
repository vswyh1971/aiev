<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试页面</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>简单测试页面</h1>
    <button id="load-sys">加载sys.txt</button>
    <button id="load-work">加载work.txt</button>
    <div id="output"></div>
    
    <script>
        $(document).ready(function() {
            console.log('页面加载完成');
            
            $('#load-sys').on('click', function() {
                console.log('点击加载sys.txt');
                $.get('sys.txt', function(data) {
                    console.log('成功加载sys.txt:', data);
                    $('#output').html('<h2>sys.txt内容:</h2><pre>' + data + '</pre>');
                }).fail(function(xhr, status, error) {
                    console.error('加载sys.txt失败:', error);
                    $('#output').html('<h2>加载失败:</h2><p>' + error + '</p>');
                });
            });
            
            $('#load-work').on('click', function() {
                console.log('点击加载work.txt');
                $.get('work.txt', function(data) {
                    console.log('成功加载work.txt:', data);
                    $('#output').html('<h2>work.txt内容:</h2><pre>' + data + '</pre>');
                }).fail(function(xhr, status, error) {
                    console.error('加载work.txt失败:', error);
                    $('#output').html('<h2>加载失败:</h2><p>' + error + '</p>');
                });
            });
        });
    </script>
</body>
</html>
